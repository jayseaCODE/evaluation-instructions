name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Read-only token limits the damage if a third-party action is compromised.
permissions:
  contents: read

# Stop superseded pull request runs, but never cancel a run on main.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

defaults:
  run:
    shell: bash

jobs:
  build-and-test:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore CompanyApi.sln

      # Warnings are errors (Directory.Build.props), so any warning fails the build.
      - name: Build
        run: dotnet build CompanyApi.sln --configuration Release --no-restore

      # Live tests call the real upstream and are excluded so the pipeline does not depend on GitHub.
      - name: Test
        run: >
          dotnet test CompanyApi.sln
          --configuration Release
          --no-build
          --filter "Category!=Live"
          --logger "trx;LogFileName=test-results.trx"
          --results-directory TestResults

      # A filter that matches nothing exits successfully, which would hide a broken test run.
      - name: Verify tests ran
        run: |
          if ! grep -q "<UnitTestResult" TestResults/test-results.trx; then
            echo "::error::No tests were executed."
            exit 1
          fi

      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: TestResults/*.trx
          if-no-files-found: warn
          retention-days: 14

  container-image:
    name: Build and smoke-test container
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Build image
        run: docker build --tag company-api:ci .

      - name: Start container
        run: docker run --detach --name company-api --publish 8080:8080 company-api:ci

      - name: Wait for readiness
        run: curl --silent --show-error --fail --retry 30 --retry-all-errors --retry-delay 1 http://localhost:8080/healthz

      # An invalid id is rejected before any upstream call, so this check needs no network access.
      - name: Check error contract
        run: |
          status=$(curl --silent --output /dev/null --write-out '%{http_code}' http://localhost:8080/v1/companies/abc)
          test "$status" = "400"

      - name: Show container logs
        if: ${{ failure() }}
        run: docker logs company-api
